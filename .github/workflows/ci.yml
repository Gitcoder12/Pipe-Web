name: Pipe-Web checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: |
          node --check app.js
          node --check geo-view.js
          node --check config.js
          node --check workers/path-worker.js
          node tests/path-worker.test.cjs
      - name: Verify application entry points
        run: |
          test -s index.html
          test -s styles.css
          test -s app.js
          test -s geo-view.js
          test -s config.js
          test -s workers/path-worker.js
          grep -q 'href="styles.css' index.html
          grep -q 'src="app.js"' index.html
          grep -q 'src="geo-view.js"' index.html
          grep -q 'src="config.js"' index.html
